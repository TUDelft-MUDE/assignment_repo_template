name: Generate assignment and solution versions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-notebook:
    name: Generate assignment and solution versions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          original_line=$(grep '^python == 3.12$' requirements.txt || true)
          sed -i '/^python == 3.13.12$/d' requirements.txt
          pip install -r requirements.txt
          pip install nbformat nbconvert
          python -m pip install ipykernel
          python -m ipykernel install --user --name=python3

      - name: Remove solution cells
        run: |
          python -c "
          import os
          import nbformat

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.ipynb'):
                      notebook_file = os.path.join(root, file)
                      with open(notebook_file) as f:
                          notebook = nbformat.read(f, as_version=4)

                      # Remove cells tagged with 'solution'
                      notebook.cells = [cell for cell in notebook.cells if 'solution' not in cell.metadata.get('tags', [])]

                      # Save the modified notebook
                      with open(notebook_file, 'w') as f:
                          nbformat.write(notebook, f)
          "
      - name: Remove solution markdown cells
        run: |
          python -c "
          import os
          import nbformat

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
            for file in files:
              if file.endswith('.ipynb'):
                notebook_file = os.path.join(root, file)
                with open(notebook_file) as f:
                  notebook = nbformat.read(f, as_version=4)

                # Remove markdown cells containing the specific background color
                notebook.cells = [
                  cell for cell in notebook.cells
                  if not (
                    '> **Solution' in cell.source
                  )
                ]

                # Save the modified notebook
                with open(notebook_file, 'w') as f:
                  nbformat.write(notebook, f)
          "

      - name: Remove solution sections from markdown files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".md"):
                      markdown_file = os.path.join(root, file)
                      with open(markdown_file, "r") as f:
                          lines = f.readlines()

                      # Remove lines between "% solution_start" and "% solution_end"
                      in_solution_block = False
                      filtered_lines = []
                      for line in lines:
                          if "% solution_start" in line:
                              in_solution_block = True
                          elif "% solution_end" in line:
                              in_solution_block = False
                          elif not in_solution_block:
                              filtered_lines.append(line)

                      # Raise an error if a solution block was not properly closed
                      if in_solution_block:
                          raise ValueError("Unclosed % solution_start detected in file: " + markdown_file)

                      # Save the modified markdown file
                      with open(markdown_file, "w") as f:
                          f.writelines(filtered_lines)
          '

      - name: Commit and push changes assignment version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete remote branches to start fresh (ignore errors if they don't exist)
          git push origin --delete assignment 2>/dev/null || true
          git push origin --delete solution 2>/dev/null || true
          
          # Delete local branches to start fresh (ignore errors if they don't exist)
          git branch -D assignment 2>/dev/null || true
          git branch -D solution 2>/dev/null || true
          
          # Create fresh assignment from cleaned main
          git checkout -b assignment origin/main
          git add .
          
          # Commit and capture hash if there are staged changes
          git commit -m "Generate assignment version" || echo "No changes to commit"
          
          #remove unnecessary files for students
          git rm .github/workflows/generate-student-notebook.yml
          git rm requirements.txt
          git add .
          git commit -m "Removed authoring files"
          
          git push origin assignment

      - name: Restore main branch and remove 'assignment' cells
        run: |
          git checkout main
          python -c "
          import os
          import nbformat

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.ipynb'):
                      notebook_file = os.path.join(root, file)
                      with open(notebook_file) as f:
                          notebook = nbformat.read(f, as_version=4)

                      # Remove cells tagged with 'assignment'
                      notebook.cells = [cell for cell in notebook.cells if 'assignment' not in cell.metadata.get('tags', [])]

                      # Save the modified notebook
                      with open(notebook_file, 'w') as f:
                          nbformat.write(notebook, f)
          "

      - name: Run notebook files
        run: |
          python -c "
          import os
          import nbformat
          from nbconvert.preprocessors import ExecutePreprocessor

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
            for file in files:
              if file.endswith('.ipynb'):
                notebook_file = os.path.join(root, file)
                with open(notebook_file) as f:
                  notebook = nbformat.read(f, as_version=4)

                # Execute the notebook
                ep = ExecutePreprocessor(timeout=60, kernel_name='python3')
                ep.preprocess(notebook, {'metadata': {'path': root}})

                # Save the executed notebook
                with open(notebook_file, 'w') as f:
                  nbformat.write(notebook, f)
          "

      - name: Remove commented lines from markdown files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
            for file in files:
              if file.endswith(".md"):
                markdown_file = os.path.join(root, file)
                with open(markdown_file, "r") as f:
                  lines = f.readlines()

                # Remove lines that start with a comment symbol
                filtered_lines = [line for line in lines if not line.strip().startswith("% solution")]

                # Save the modified markdown file
                with open(markdown_file, "w") as f:
                  f.writelines(filtered_lines)
          '

      - name: Commit and push solution version
        run: |          
          # Create fresh solution from cleaned main
          git checkout -b solution origin/main
          git add .
          
          # Commit and capture hash if there are staged changes
          git commit -m "Generate solution version" || echo "No changes to commit"

          #remove unnecessary files for students
          git rm .github/workflows/generate-student-notebook.yml
          git rm requirements.txt
          git add .
          git commit -m "Removed authoring files"
          
          git push origin solution
