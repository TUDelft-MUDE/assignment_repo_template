name: Generate assignment and solution versions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-notebook:
    name: Generate assignment and solution versions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep requirements.txt unchanged in the repo; pip cannot install a python pin line.
          filtered_requirements=$(grep -Eiv '^[[:space:]]*(python[[:space:]]*(==|=)|#|$)' requirements.txt || true)
          if [ -n "$filtered_requirements" ]; then
            printf '%s\n' "$filtered_requirements" | pip install -r /dev/stdin
          fi
          pip install nbformat nbconvert
          python -m pip install ipykernel
          python -m ipykernel install --user --name=python3

      - name: Remove solution cells
        run: |
          python -c "
          import os
          import nbformat

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.ipynb'):
                      notebook_file = os.path.join(root, file)
                      with open(notebook_file) as f:
                          notebook = nbformat.read(f, as_version=4)

                      # Remove cells tagged with 'solution'
                      notebook.cells = [cell for cell in notebook.cells if 'solution' not in cell.metadata.get('tags', [])]

                      # Save the modified notebook
                      with open(notebook_file, 'w') as f:
                          nbformat.write(notebook, f)
          "
      - name: Remove solution markdown cells
        run: |
          python -c "
          import os
          import nbformat

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
            for file in files:
              if file.endswith('.ipynb'):
                notebook_file = os.path.join(root, file)
                with open(notebook_file) as f:
                  notebook = nbformat.read(f, as_version=4)

                # Remove markdown cells containing the specific background color
                notebook.cells = [
                  cell for cell in notebook.cells
                  if not (
                    '> **Solution' in cell.source
                  )
                ]

                # Save the modified notebook
                with open(notebook_file, 'w') as f:
                  nbformat.write(notebook, f)
          "

      - name: Remove solution sections from markdown files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".md"):
                      markdown_file = os.path.join(root, file)
                      with open(markdown_file, "r") as f:
                          lines = f.readlines()

                      # Remove lines between "% solution_start" and "% solution_end"
                      in_solution_block = False
                      filtered_lines = []
                      for line in lines:
                          if "% solution_start" in line:
                              in_solution_block = True
                          elif "% solution_end" in line:
                              in_solution_block = False
                          elif not in_solution_block:
                              filtered_lines.append(line)

                      # Raise an error if a solution block was not properly closed
                      if in_solution_block:
                          raise ValueError("Unclosed % solution_start detected in file: " + markdown_file)

                      # Save the modified markdown file
                      with open(markdown_file, "w") as f:
                          f.writelines(filtered_lines)
          '
      
      - name: Remove solution sections from py files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".py"):
                      py_file = os.path.join(root, file)
                      with open(py_file, "r") as f:
                          lines = f.readlines()

                      # Remove lines between "# solution_start" and "# solution_end"
                      in_solution_block = False
                      filtered_lines = []
                      for line in lines:
                          if "# solution_start" in line:
                              in_solution_block = True
                          elif "# solution_end" in line:
                              in_solution_block = False
                          elif not in_solution_block:
                              filtered_lines.append(line)

                      # Raise an error if a solution block was not properly closed
                      if in_solution_block:
                          raise ValueError("Unclosed # solution_start detected in file: " + py_file)

                      # Save the modified python file
                      with open(py_file, "w") as f:
                          f.writelines(filtered_lines)
          '
      
      - name: Remove assignment lines from py files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".py"):
                      py_file = os.path.join(root, file)
                      with open(py_file, "r") as f:
                          lines = f.readlines()
                      
                      filtered_lines = [line for line in lines if not line.strip().startswith("# assignment")]

                      # Save the modified python file
                      with open(py_file, "w") as f:
                          f.writelines(filtered_lines)
          '

      - name: Commit and push changes assignment version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete remote branches to start fresh (ignore errors if they don't exist)
          git push origin --delete assignment 2>/dev/null || true
          git push origin --delete solution 2>/dev/null || true
          
          # Delete local branches to start fresh (ignore errors if they don't exist)
          git branch -D assignment 2>/dev/null || true
          git branch -D solution 2>/dev/null || true
          
          # Create fresh assignment from cleaned main
          git checkout -b assignment origin/main
          git add .
          
          # Commit and capture hash if there are staged changes
          git commit -m "Generate assignment version" || echo "No changes to commit"
          
          #remove unnecessary files for students
          git rm .github/workflows/generate-student-notebook.yml

          archive_name="$(python - <<'PY'
          import os
          import re

          repo_name = os.environ['GITHUB_REPOSITORY'].rsplit('/', 1)[-1]
          repo_name = re.sub(r'(?<=[A-Za-z])(?=[0-9])|(?<=[0-9])(?=[A-Za-z])', '_', repo_name)
          repo_name = re.sub(r'[^A-Za-z0-9]+', '_', repo_name).strip('_')
          print(f'all_files_{repo_name}.zip')
          PY
          )"
          export ARCHIVE_NAME="$archive_name"
          rm -f "$archive_name"
          python - <<'PY'
          import os
          import pathlib
          import zipfile

          root = pathlib.Path('.').resolve()
          archive_path = root / os.environ['ARCHIVE_NAME']

          with zipfile.ZipFile(archive_path, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
            for path in sorted(root.rglob('*')):
              if not path.is_file():
                continue
              if '.git' in path.parts or '.github' in path.parts:
                continue
              if path == archive_path:
                continue
              archive.write(path, path.relative_to(root))
          PY

          python - <<'PY'
          import os
          import pathlib
          import nbformat

          root = pathlib.Path('.').resolve()
          archive_path = root / os.environ['ARCHIVE_NAME']
          link_template = '\n'.join([
            '```{{custom_download_link}} {archive_rel_path}',
            ':text: ".zip assignment"',
            ':replace_default: "True"',
            '```',
          ])

          def relative_archive_path(file_path: pathlib.Path) -> str:
            rel_path = archive_path.relative_to(file_path.parent, walk_up=True).as_posix()
            if not rel_path.startswith('.'):
              rel_path = f'./{rel_path}'
            return rel_path

          for file_path in sorted(root.rglob('*')):
            if not file_path.is_file():
              continue
            if '.git' in file_path.parts:
              continue

            if file_path.suffix == '.md':
              link_block = link_template.format(archive_rel_path=relative_archive_path(file_path))
              content = file_path.read_text(encoding='utf-8')
              if link_block in content:
                continue
              separator = '' if content.endswith('\n') or not content else '\n'
              file_path.write_text(f"{content}{separator}\n{link_block}\n", encoding='utf-8')

            if file_path.suffix == '.ipynb':
              link_block = link_template.format(archive_rel_path=relative_archive_path(file_path))
              with file_path.open(encoding='utf-8') as notebook_handle:
                notebook = nbformat.read(notebook_handle, as_version=4)

              download_cell = nbformat.v4.new_markdown_cell(link_block)
              notebook.cells.append(download_cell)

              with file_path.open('w', encoding='utf-8') as notebook_handle:
                nbformat.write(notebook, notebook_handle)
          PY

          git add .
          git commit -m "Removed authoring files, added assignment archive, and inserted download links"
          
          git push origin assignment

      - name: Restore main branch and remove 'assignment' cells
        run: |
          git checkout main
          python -c "
          import os
          import nbformat

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.ipynb'):
                      notebook_file = os.path.join(root, file)
                      with open(notebook_file) as f:
                          notebook = nbformat.read(f, as_version=4)

                      # Remove cells tagged with 'assignment'
                      notebook.cells = [cell for cell in notebook.cells if 'assignment' not in cell.metadata.get('tags', [])]

                      # Save the modified notebook
                      with open(notebook_file, 'w') as f:
                          nbformat.write(notebook, f)
          "

      - name: Run notebook files
        run: |
          python -c "
          import os
          import nbformat
          from nbconvert.preprocessors import ExecutePreprocessor

          # Walk through all files in the repository
          for root, _, files in os.walk('.'):
            for file in files:
              if file.endswith('.ipynb'):
                notebook_file = os.path.join(root, file)
                with open(notebook_file) as f:
                  notebook = nbformat.read(f, as_version=4)

                # Execute the notebook
                ep = ExecutePreprocessor(timeout=60, kernel_name='python3')
                ep.preprocess(notebook, {'metadata': {'path': root}})

                # Save the executed notebook
                with open(notebook_file, 'w') as f:
                  nbformat.write(notebook, f)
          "

      - name: Remove commented lines from markdown files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
            for file in files:
              if file.endswith(".md"):
                markdown_file = os.path.join(root, file)
                with open(markdown_file, "r") as f:
                  lines = f.readlines()

                # Remove lines that start with a comment symbol
                filtered_lines = [line for line in lines if not line.strip().startswith("% solution")]

                # Save the modified markdown file
                with open(markdown_file, "w") as f:
                  f.writelines(filtered_lines)
          '

      - name: Remove assignment sections from py files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".py"):
                      py_file = os.path.join(root, file)
                      with open(py_file, "r") as f:
                          lines = f.readlines()

                      # Remove lines between "# assignment_start" and "# assignment_end"
                      in_assignment_block = False
                      filtered_lines = []
                      for line in lines:
                          if "# assignment_start" in line:
                              in_assignment_block = True
                          elif "# assignment_end" in line:
                              in_assignment_block = False
                          elif not in_assignment_block:
                              filtered_lines.append(line)

                      # Raise an error if an assignment block was not properly closed
                      if in_assignment_block:
                          raise ValueError("Unclosed # assignment_start detected in file: " + py_file)

                      # Save the modified python file
                      with open(py_file, "w") as f:
                          f.writelines(filtered_lines)
          '
      
      - name: Remove solution lines from py files
        run: |
          python -c '
          import os

          # Walk through all files in the repository
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".py"):
                      py_file = os.path.join(root, file)
                      with open(py_file, "r") as f:
                          lines = f.readlines()

                      filtered_lines = [line for line in lines if not line.strip().startswith("# solution")]

                      # Save the modified python file
                      with open(py_file, "w") as f:
                          f.writelines(filtered_lines)
          '

      - name: Commit and push solution version
        run: |          
          # Create fresh solution from cleaned main
          git checkout -b solution origin/main
          git add .
          
          # Commit and capture hash if there are staged changes
          git commit -m "Generate solution version" || echo "No changes to commit"

          #remove unnecessary files for students
          git rm .github/workflows/generate-student-notebook.yml

          archive_name="$(python - <<'PY'
          import os
          import re

          repo_name = os.environ['GITHUB_REPOSITORY'].rsplit('/', 1)[-1]
          repo_name = re.sub(r'(?<=[A-Za-z])(?=[0-9])|(?<=[0-9])(?=[A-Za-z])', '_', repo_name)
          repo_name = re.sub(r'[^A-Za-z0-9]+', '_', repo_name).strip('_')
          print(f'all_files_{repo_name}.zip')
          PY
          )"
          export ARCHIVE_NAME="$archive_name"
          rm -f "$archive_name"
          git show "assignment:$archive_name" > "$archive_name"

          python - <<'PY'
          import os
          import pathlib
          import nbformat

          root = pathlib.Path('.').resolve()
          archive_path = root / os.environ['ARCHIVE_NAME']
          link_template = '\n'.join([
            '```{{custom_download_link}} {archive_rel_path}',
            ':text: ".zip assignment"',
            ':replace_default: "True"',
            '```',
          ])

          def relative_archive_path(file_path: pathlib.Path) -> str:
            rel_path = archive_path.relative_to(file_path.parent, walk_up=True).as_posix()
            if not rel_path.startswith('.'):
              rel_path = f'./{rel_path}'
            return rel_path

          for file_path in sorted(root.rglob('*')):
            if not file_path.is_file():
              continue
            if '.git' in file_path.parts:
              continue

            if file_path.suffix == '.md':
              link_block = link_template.format(archive_rel_path=relative_archive_path(file_path))
              content = file_path.read_text(encoding='utf-8')
              if link_block in content:
                continue
              separator = '' if content.endswith('\n') or not content else '\n'
              file_path.write_text(f"{content}{separator}\n{link_block}\n", encoding='utf-8')

            if file_path.suffix == '.ipynb':
              link_block = link_template.format(archive_rel_path=relative_archive_path(file_path))
              with file_path.open(encoding='utf-8') as notebook_handle:
                notebook = nbformat.read(notebook_handle, as_version=4)

              download_cell = nbformat.v4.new_markdown_cell(link_block)
              notebook.cells.append(download_cell)

              with file_path.open('w', encoding='utf-8') as notebook_handle:
                nbformat.write(notebook, notebook_handle)
          PY

          git add .
          git commit -m "Removed authoring files, reused assignment archive, and inserted download links"
          
          git push origin solution
